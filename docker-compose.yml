version: '3'

x-logging: &default-logging
  options:
    max-size: "12m"
    max-file: "5"
  driver: json-file

services:

  nanolive_votes:
    build: 
      context: .
      dockerfile: ./Dockerfile
    container_name : nanolive_votes
    restart: "unless-stopped"
    ports:    
     - '127.0.0.1:5055:80'    
    logging: *default-logging

